name: Bug report
description: Report a problem with the PetSafe FreshFeed integration.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove personal data before posting. Never paste your local key, password or
        account details.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Attach the integration's redacted diagnostics (Settings > Devices & services >
        PetSafe FreshFeed > Download diagnostics) and any relevant log lines.
