name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest-homeassistant-custom-component==0.13.375 tinytuya==1.20.0
      - run: python -m unittest discover -s test_backend -q
      - name: Check no-profile release ZIP
        run: |
          python tools/build-release.py --output "$RUNNER_TEMP/petsafe-release"
          cd "$RUNNER_TEMP/petsafe-release"
          sha256sum -c --strict SHA256SUMS
      - run: python -m pytest test_ha -q --asyncio-mode=auto -p no:cacheprovider
