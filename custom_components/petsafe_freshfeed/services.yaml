save_schedule:
  name: Save schedule
  description: Requires an authenticated administrator. Save the complete schedule using its last known revision. A device report does not prove physical execution.
  fields:
    entry_id:
      required: true
      selector:
        text:
    entries:
      required: true
      selector:
        object:
    base_revision:
      required: true
      selector:
        text:
command:
  name: Confirm feeder command
  description: Requires an authenticated administrator. Send one confirmed Feed, Cancel, Defrost or Refilled operation without replay.
  fields:
    entry_id:
      required: true
      selector:
        text:
    operation:
      required: true
      selector:
        select:
          options: [feed, cancel, defrost, refilled]
    confirmed:
      required: true
      selector:
        boolean:
recover:
  name: Check and clear uncertainty
  description: Requires an authenticated administrator. Confirm you checked the feeder, then collect fresh reports for up to 35 seconds. Clearing local uncertainty does not repeat a command or prove it completed; uncertainty may return after restart.
  fields:
    entry_id:
      required: true
      selector:
        text:
    operation_id:
      required: true
      selector:
        text:
    session_id:
      required: true
      selector:
        text:
    confirmed:
      required: true
      selector:
        boolean:
