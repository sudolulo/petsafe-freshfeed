blueprint:
  name: FreshFeed refill and cleaning reminders
  description: >-
    Store observed refill dates and explicit cleaning acknowledgements, then remind
    daily when overdue. Create two input_datetime helpers with BOTH date and time
    enabled and initialize them yourself before use; unset/unknown dates are skipped.
    A refill observation is not proof the tray was filled, and an acknowledgement
    is not proof of physical cleaning. Stale restored events are ignored;
    check the refill helper after reconnecting. Choose notification actions only; this blueprint
    updates helpers but never sends feeder commands.
  domain: automation
  homeassistant:
    min_version: '2026.10.0'
  source_url: https://github.com/sudolulo/petsafe-freshfeed/blob/trunk/blueprints/automation/petsafe_freshfeed/refill_cleaning_reminder.yaml
  input:
    feeding_event:
      name: Feeding event
      selector:
        entity:
          filter:
            - domain: event
    daily_time:
      name: Daily reminder time (Home Assistant local time)
      default: '09:00:00'
      selector:
        time: {}
    refill_helper:
      name: Last observed refill (date and time helper)
      selector:
        entity:
          filter:
            - domain: input_datetime
    cleaning_helper:
      name: Last acknowledged cleaning (date and time helper)
      selector:
        entity:
          filter:
            - domain: input_datetime
    cleaning_button:
      name: Cleaning acknowledgement button
      selector:
        entity:
          filter:
            - domain: input_button
    refill_days:
      name: Refill reminder interval in days
      default: 7
      selector:
        number:
          min: 1
          max: 90
          step: 1
    cleaning_days:
      name: Cleaning reminder interval in days
      default: 30
      selector:
        number:
          min: 1
          max: 90
          step: 1
    refill_notification_action:
      name: Refill reminder notification actions
      selector:
        action: {}
    cleaning_notification_action:
      name: Cleaning reminder notification actions
      selector:
        action: {}
mode: queued
max: 10
variables:
  refill_entity: !input refill_helper
  cleaning_entity: !input cleaning_helper
  refill_interval: !input refill_days
  cleaning_interval: !input cleaning_days
triggers:
  - trigger: state
    entity_id: !input feeding_event
    id: refill
  - trigger: state
    entity_id: !input cleaning_button
    id: cleaning
  - trigger: time
    at: !input daily_time
    id: daily
actions:
  - choose:
      - conditions: >-
          {{ trigger.id in ['refill', 'cleaning'] and
             trigger.from_state is not none and trigger.to_state is not none and
             as_timestamp(trigger.to_state.state, none) is not none and
             trigger.from_state.state != trigger.to_state.state and
             (as_timestamp(trigger.from_state.state, none) is not none or
              trigger.from_state.state in ['unknown', 'unavailable']) and
             0 <= as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.to_state.state) < 5 and
             not trigger.from_state.attributes.get('restored', false) and
             not trigger.to_state.attributes.get('restored', false) and
             (trigger.id == 'cleaning' or trigger.to_state.attributes.get('event_type') == 'refilled') }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ refill_entity if trigger.id == 'refill' else cleaning_entity }}"
            data:
              timestamp: '{{ as_timestamp(trigger.to_state.state) }}'
      - conditions: "{{ trigger.id == 'daily' }}"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set stamp = state_attr(refill_entity, 'timestamp') if states(refill_entity) not in ['unknown', 'unavailable'] and state_attr(refill_entity, 'has_date') and state_attr(refill_entity, 'has_time') else none %}
                  {{ stamp is not none and now().timestamp() - stamp >= refill_interval | float * 86400 }}
            then: !input refill_notification_action
          - if:
              - condition: template
                value_template: >-
                  {% set stamp = state_attr(cleaning_entity, 'timestamp') if states(cleaning_entity) not in ['unknown', 'unavailable'] and state_attr(cleaning_entity, 'has_date') and state_attr(cleaning_entity, 'has_time') else none %}
                  {{ stamp is not none and now().timestamp() - stamp >= cleaning_interval | float * 86400 }}
            then: !input cleaning_notification_action
