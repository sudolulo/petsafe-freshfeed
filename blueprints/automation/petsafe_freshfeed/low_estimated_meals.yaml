blueprint:
  name: FreshFeed low estimated meals
  description: >-
    Notify after estimated meals cross below a threshold. Estimates assume a
    filled tray; they do not measure food or consumption. Unknown startup states
    do not alert. Choose notification actions only, not feeder commands.
  domain: automation
  homeassistant:
    min_version: '2026.10.0'
  source_url: https://github.com/sudolulo/petsafe-freshfeed/blob/trunk/blueprints/automation/petsafe_freshfeed/low_estimated_meals.yaml
  input:
    meals_entity:
      name: Estimated meals remaining
      selector:
        entity:
          filter:
            - domain: sensor
    threshold:
      name: Alert below
      default: 2
      selector:
        number:
          min: 0
          max: 5
          step: 1
    hold:
      name: Continuous hold
      default:
        minutes: 5
      selector:
        duration: {}
    notification_action:
      name: Notification actions
      selector:
        action: {}
mode: single
triggers:
  - trigger: numeric_state
    entity_id: !input meals_entity
    below: !input threshold
    for: !input hold
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and
         is_number(trigger.from_state.state) and
         not trigger.from_state.attributes.get('restored', false) }}
actions: !input notification_action
